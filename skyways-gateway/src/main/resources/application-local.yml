# Local dev profile: use static service URLs instead of Eureka discovery
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: flight-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/flights/**
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**
        - id: booking-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/bookings/**
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/payments/**

eureka:
  client:
    enabled: false
    fetch-registry: false
    register-with-eureka: false