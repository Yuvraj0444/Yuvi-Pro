input {
  # ── Direct TCP from Log4j2 SocketAppender (JSON, one event per line) ─────────
  tcp {
    port  => 5000
    codec => json_lines
    tags  => ["log4j2-tcp"]
  }

  # ── Filebeat / Elastic Agent (file-based log shipping in Kubernetes) ──────────
  beats {
    port => 5044
    tags => ["filebeat"]
  }
}

filter {
  # ── Parse epoch timestamp from Log4j2 JSON layout ────────────────────────────
  if [instant] {
    date {
      match    => ["[instant][epochSecond]", "UNIX"]
      target   => "@timestamp"
      timezone => "UTC"
    }
    mutate { remove_field => ["instant"] }
  }

  # ── Normalise log level field name ────────────────────────────────────────────
  if [level] {
    mutate { rename => { "level" => "log_level" } }
  }

  # ── Tag slow requests (latency > 2 000 ms) ────────────────────────────────────
  if [latencyMs] and [latencyMs] > 2000 {
    mutate { add_tag => ["slow-request"] }
  }

  # ── Add deployment environment field ─────────────────────────────────────────
  mutate {
    add_field => { "environment" => "${ENVIRONMENT:docker}" }
  }

  # ── Drop actuator health-check noise ─────────────────────────────────────────
  if [message] =~ "/actuator/health" {
    drop {}
  }
}

output {
  elasticsearch {
    hosts           => ["http://elasticsearch:9200"]
    index           => "skyways-logs-%{[service]:unknown}-%{+YYYY.MM.dd}"
    action          => "index"
    manage_template => false
  }
  # stdout { codec => rubydebug }   # uncomment for local debugging
}