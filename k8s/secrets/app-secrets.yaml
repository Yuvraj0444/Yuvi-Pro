# WARNING: Never commit real secrets. This is a template only.
# In production, populate values from GCP Secret Manager via an init-container
# or using the External Secrets Operator.
# The name must match secretKeyRef.name in all Deployment manifests.
apiVersion: v1
kind: Secret
metadata:
  name: skyways-app-secrets
  namespace: skyways-core
type: Opaque
stringData:
  # ── Eureka ────────────────────────────────────────────────────────────────
  EUREKA_PASSWORD: "REPLACE_AT_DEPLOY"

  # ── Git (Config Server) ───────────────────────────────────────────────────
  GIT_PASSWORD: "REPLACE_AT_DEPLOY"

  # ── Per-service PostgreSQL passwords ──────────────────────────────────────
  USER_DB_PASS:    "REPLACE_AT_DEPLOY"
  FLIGHT_DB_PASS:  "REPLACE_AT_DEPLOY"
  BOOKING_DB_PASS: "REPLACE_AT_DEPLOY"
  PAYMENT_DB_PASS: "REPLACE_AT_DEPLOY"
  SAGA_DB_PASS:    "REPLACE_AT_DEPLOY"

  # API keys fetched at runtime by SecretManagerService from GCP Secret Manager
  # (STRIPE_SECRET_KEY, SENDGRID_API_KEY, SKYSCANNER_API_KEY, GDS_API_KEY,
  #  TRIPLE_DES_KEY, JWT_SECRET) — NOT stored here.
