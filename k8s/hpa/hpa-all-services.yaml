apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skyways-gateway-hpa
  namespace: skyways-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skyways-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
