# SkyWays Kafka Consumer Group Assignments
# Each entry: group-id = topic(s) it consumes

# Saga Orchestrator — drives the full saga state machine
skyways-saga-orchestrator = booking-initiated, seat-reservation-confirmed, seat-reservation-failed, payment-processed, payment-failed

# Flight Service — handles seat reservation and release commands
skyways-flight-service = seat-reservation-requested, seat-release-requested

# Payment Service — handles payment initiation commands
skyways-payment-service = payment-initiation-requested

# Notification Service — handles confirmed/cancelled booking notifications
skyways-notification-service = notification-requested, booking-confirmed, booking-cancelled

# User Service — audit log consumer
skyways-user-service = user-events

# Booking Service — receives saga completion events to update booking state
skyways-booking-service = saga-events

# --- Producer idempotency config (applied in KafkaProducerConfig) ---
# acks=all
# enable.idempotence=true
# max.in.flight.requests.per.connection=5
# retries=Integer.MAX_VALUE
